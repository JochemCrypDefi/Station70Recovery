[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s70-recovery"
version = "1.0.0"
description = "Offline tool for recovering wallet keys from a Station70 backup, displaying them in importable form, and exporting them to AWS KMS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# Core dependencies. Deliberately small and pure-Python where possible so the
# whole set can be vendored as wheels onto an air-gapped machine.
dependencies = [
    "cryptography>=42.0",   # RSA-OAEP, Ed25519, secp256k1, AES key wrap (RFC 5649)
    "pycryptodome>=3.20",   # keccak256 + RIPEMD160 (both missing from hashlib)
    "pynacl>=1.5",          # xsalsa20-poly1305 for the Polkadot keystore
    "textual>=0.79",        # TUI
    "rich>=13.7",           # tables / panels (pulled in by textual anyway)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
s70 = "s70.cli:main"

[tool.setuptools.packages.find]
include = ["s70*"]

[tool.setuptools.package-data]
s70 = ["tui/*.tcss"]
